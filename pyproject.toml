[project]
name = "ml-experimentation-mcp"
version = "0.1.0"
description = "TabularML Agent -- 5-server MCP system for end-to-end ML experimentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.2",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "mlflow>=2.10.0",
]

[project.optional-dependencies]
imbalanced = [
    "imbalanced-learn>=0.10.0",
]
plotting = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
]
all = [
    "imbalanced-learn>=0.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "xgboost>=1.7.0",
    "lightgbm>=3.3.0",
    "shap>=0.41.0",
    "statsmodels>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
